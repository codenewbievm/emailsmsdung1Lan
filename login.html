<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5GSMS - Đăng nhập</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full">
        <div class="text-center mb-8">
            <div class="bg-blue-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-md">
                <i class="fas fa-paper-plane text-white text-2xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">Chào mừng tới 5GSMS</h2>
            <p class="text-gray-500">Vui lòng đăng nhập để sử dụng dịch vụ</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" class="mt-1 block w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="your-email@gmail.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Mật khẩu</label>
                <input type="password" id="password" class="mt-1 block w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="••••••••">
            </div>
            <button id="btnLogin" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition">Đăng nhập</button>
            <button id="btnSignup" class="w-full bg-gray-200 text-gray-700 p-3 rounded-lg font-bold hover:bg-gray-300 transition">Đăng ký tài khoản mới</button>
        </div>
        
        <p id="msg" class="mt-4 text-center text-sm font-medium"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Sử dụng chung Config với index.html của bạn
        const firebaseConfig = {
            apiKey: "AIzaSyDb1w0ZJxyTAY2usK6Agnr1ArQ_YIOGh-Y",
            authDomain: "tempmail-login-810b3.firebaseapp.com",
            projectId: "tempmail-login-810b3",
            appId: "1:821078583826:web:04cc70bfbbc36cba6dc6cb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Nếu đã đăng nhập rồi thì tự chuyển sang index
        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = 'index.html';
        });

        const emailInput = document.getElementById('email');
        const passInput = document.getElementById('password');
        const msg = document.getElementById('msg');

        // Hàm Đăng Nhập
        document.getElementById('btnLogin').onclick = () => {
            signInWithEmailAndPassword(auth, emailInput.value, passInput.value)
                .then(() => { window.location.href = 'index.html'; })
                .catch(err => { 
                    msg.innerText = "Lỗi: Sai tài khoản hoặc mật khẩu!";
                    msg.className = "mt-4 text-center text-sm font-medium text-red-500";
                });
        };

        // Hàm Đăng Ký
        document.getElementById('btnSignup').onclick = () => {
            createUserWithEmailAndPassword(auth, emailInput.value, passInput.value)
                .then(() => { msg.innerText = "Đăng ký thành công! Đang đăng nhập..."; msg.className = "text-green-500"; })
                .catch(err => { 
                    msg.innerText = "Lỗi: Email đã tồn tại hoặc mật khẩu quá ngắn!";
                    msg.className = "mt-4 text-center text-sm font-medium text-red-500";
                });
        };
    </script>
</body>
</html>
