<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>5GSMS — Đăng nhập bảo mật</title>

<meta name="description" content="5GSMS Login System">

<meta http-equiv="Content-Security-Policy"
content="
default-src 'self';
img-src 'self' https: data:;
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com;
script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://www.google.com https://www.gstatic.com/recaptcha/;
connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com;
">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

:root{
--blue:#2563eb;
--blueDark:#1d4ed8;
--bg:#f8fbff;
--card:#ffffff;
--text:#0f172a;
--muted:#64748b;
--border:#e2e8f0;
--success:#22c55e;
--danger:#ef4444;
--shadow:0 10px 40px rgba(0,0,0,.08);
}

body.dark{
--bg:#020617;
--card:#0f172a;
--text:#e2e8f0;
--muted:#94a3b8;
--border:#1e293b;
--shadow:none;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Syne',sans-serif;
background:var(--bg);
color:var(--text);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
transition:.25s;
}

.login-box{
width:100%;
max-width:460px;
background:var(--card);
border:1px solid var(--border);
border-radius:32px;
padding:36px;
box-shadow:var(--shadow);
position:relative;
overflow:hidden;
}

.glow{
position:absolute;
width:300px;
height:300px;
background:rgba(37,99,235,.15);
filter:blur(80px);
top:-120px;
right:-100px;
pointer-events:none;
}

.top{
text-align:center;
position:relative;
z-index:2;
}

.logo{
width:90px;
height:90px;
border-radius:28px;
background:linear-gradient(135deg,#2563eb,#1d4ed8);
display:flex;
justify-content:center;
align-items:center;
margin:auto;
margin-bottom:22px;
color:white;
font-size:34px;
box-shadow:0 10px 30px rgba(37,99,235,.3);
}

.title{
font-size:32px;
font-weight:800;
}

.subtitle{
margin-top:10px;
font-size:14px;
line-height:1.8;
color:var(--muted);
}

.form{
margin-top:32px;
display:flex;
flex-direction:column;
gap:18px;
position:relative;
z-index:2;
}

.field{
display:flex;
flex-direction:column;
gap:8px;
}

.label{
font-size:13px;
font-weight:700;
}

.input-wrap{
position:relative;
}

.input{
width:100%;
padding:18px;
padding-left:52px;
border-radius:18px;
border:2px solid var(--border);
background:var(--bg);
outline:none;
font-size:14px;
font-family:'Syne',sans-serif;
color:var(--text);
transition:.2s;
}

.input:focus{
border-color:var(--blue);
}

.input-icon{
position:absolute;
left:18px;
top:50%;
transform:translateY(-50%);
color:var(--muted);
}

.btn{
border:none;
outline:none;
cursor:pointer;
padding:18px;
border-radius:18px;
font-weight:800;
font-size:15px;
transition:.2s;
font-family:'Syne',sans-serif;
}

.btn:active{
transform:scale(.96);
}

.btn-primary{
background:var(--blue);
color:white;
}

.btn-primary:hover{
background:var(--blueDark);
}

.btn-secondary{
background:var(--bg);
color:var(--text);
border:2px solid var(--border);
}

.btn-secondary:hover{
border-color:var(--blue);
}

.row{
display:flex;
gap:12px;
margin-top:10px;
}

.row .btn{
flex:1;
}

.status{
margin-top:22px;
padding:16px;
border-radius:18px;
font-size:13px;
font-weight:700;
display:none;
line-height:1.7;
}

.status.success{
display:block;
background:#dcfce7;
color:#166534;
}

.status.error{
display:block;
background:#fee2e2;
color:#991b1b;
}

.footer{
margin-top:26px;
text-align:center;
font-size:12px;
color:var(--muted);
line-height:1.7;
}

.toggle-dark{
position:absolute;
top:18px;
right:18px;
width:48px;
height:48px;
border:none;
border-radius:16px;
cursor:pointer;
background:var(--bg);
color:var(--text);
font-size:16px;
z-index:5;
}

.loading{
pointer-events:none;
opacity:.7;
}

.loading .btn-primary{
position:relative;
}

.loading .btn-primary::after{
content:'';
width:18px;
height:18px;
border:3px solid rgba(255,255,255,.4);
border-top-color:white;
border-radius:50%;
position:absolute;
right:18px;
top:50%;
transform:translateY(-50%);
animation:spin .7s linear infinite;
}

@keyframes spin{
to{
transform:translateY(-50%) rotate(360deg);
}
}

@media(max-width:600px){

.login-box{
padding:24px;
border-radius:24px;
}

.title{
font-size:26px;
}

*{
transition:none !important;
}

}

</style>
</head>

<body>

<div class="login-box" id="loginBox">

<div class="glow"></div>

<button class="toggle-dark"
onclick="toggleDarkMode()">
<i class="fas fa-moon"></i>
</button>

<div class="top">

<div class="logo">
<i class="fas fa-paper-plane"></i>
</div>

<div class="title">
5GSMS
</div>

<div class="subtitle">
Hệ thống đăng nhập bảo mật cao với Firebase Authentication.
</div>

</div>

<div class="form">

<div class="field">

<div class="label">
Email
</div>

<div class="input-wrap">

<i class="fas fa-envelope input-icon"></i>

<input
type="email"
id="email"
class="input"
placeholder="your-email@gmail.com"
autocomplete="email"
/>

</div>

</div>

<div class="field">

<div class="label">
Mật khẩu
</div>

<div class="input-wrap">

<i class="fas fa-lock input-icon"></i>

<input
type="password"
id="password"
class="input"
placeholder="••••••••"
autocomplete="current-password"
/>

</div>

</div>

<div class="row">

<button
class="btn btn-primary"
onclick="login()">
Đăng nhập
</button>

<button
class="btn btn-secondary"
onclick="signup()">
Đăng ký
</button>

</div>

<div class="status"
id="status"></div>

</div>

<div class="footer">
© 2026 5GSMS — Secure Authentication
</div>

</div>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
createUserWithEmailAndPassword,
sendEmailVerification,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig={

apiKey:"YOUR_API_KEY",
authDomain:"YOUR_AUTH_DOMAIN",
projectId:"YOUR_PROJECT_ID",
appId:"YOUR_APP_ID"

};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

onAuthStateChanged(auth,(user)=>{

if(user){

location.href='index.html';

}

});

const emailInput=document.getElementById('email');

const passwordInput=document.getElementById('password');

const statusBox=document.getElementById('status');

const loginBox=document.getElementById('loginBox');

let lastAction=0;

function cooldown(ms=8000){

const now=Date.now();

if(now-lastAction<ms){

throw new Error('Vui lòng chờ vài giây trước khi tiếp tục');

}

lastAction=now;

}

function showStatus(text,type='success'){

statusBox.className=`status ${type}`;

statusBox.textContent=text;

}

function setLoading(state){

if(state){

loginBox.classList.add('loading');

}else{

loginBox.classList.remove('loading');

}

}

function validateEmail(email){

return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

}

function validatePassword(password){

return /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/.test(password);

}

function parseFirebaseError(code){

switch(code){

case 'auth/email-already-in-use':
return 'Email đã tồn tại';

case 'auth/invalid-email':
return 'Email không hợp lệ';

case 'auth/weak-password':
return 'Mật khẩu quá yếu';

case 'auth/user-not-found':
return 'Không tìm thấy tài khoản';

case 'auth/wrong-password':
return 'Sai mật khẩu';

case 'auth/too-many-requests':
return 'Quá nhiều yêu cầu, thử lại sau';

default:
return 'Có lỗi xảy ra';

}

}

window.signup=async()=>{

try{

setLoading(true);

cooldown();

const email=emailInput.value.trim();

const password=passwordInput.value.trim();

if(!validateEmail(email)){

throw new Error('Email không hợp lệ');

}

if(!validatePassword(password)){

throw new Error(
'Mật khẩu cần ít nhất 8 ký tự gồm chữ hoa, chữ thường và số'
);

}

const credential=
await createUserWithEmailAndPassword(
auth,
email,
password
);

await sendEmailVerification(
credential.user
);

showStatus(
'Đăng ký thành công! Đang chuyển hướng...',
'success'
);

setTimeout(()=>{

location.href='index.html';

},1800);

}catch(err){

showStatus(
parseFirebaseError(err.code) || err.message,
'error'
);

console.error(err);

}finally{

setLoading(false);

}

};

window.login=async()=>{

try{

setLoading(true);

cooldown();

const email=emailInput.value.trim();

const password=passwordInput.value.trim();

if(!validateEmail(email)){

throw new Error('Email không hợp lệ');

}

await signInWithEmailAndPassword(
auth,
email,
password
);

showStatus(
'Đăng nhập thành công!',
'success'
);

setTimeout(()=>{

location.href='index.html';

},1000);

}catch(err){

showStatus(
parseFirebaseError(err.code) || err.message,
'error'
);

console.error(err);

}finally{

setLoading(false);

}

};

function toggleDarkMode(){

document.body.classList.toggle('dark');

localStorage.setItem(
'darkmode',
document.body.classList.contains('dark')
);

}

window.toggleDarkMode=toggleDarkMode;

if(localStorage.getItem('darkmode')==='true'){

document.body.classList.add('dark');

}

window.addEventListener('keydown',(e)=>{

if(e.key==='Enter'){

login();

}

});

window.addEventListener('error',(e)=>{

console.error(e.error);

});

</script>

</body>
</html>
