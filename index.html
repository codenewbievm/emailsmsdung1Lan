<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Tạm Thời - Miễn Phí</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-blue-600 p-4 text-white shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold"><i class="fas fa-envelope-open-text mr-2"></i>Temp Mail v1</h1>
            <button onclick="location.reload()" class="bg-blue-500 hover:bg-blue-700 px-3 py-1 rounded text-sm">
                <i class="fas fa-sync-alt"></i> Làm mới
            </button>
        </div>
    </nav>

    <div class="container mx-auto p-4 max-w-2xl">
        <!-- Box hiển thị Email -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2">Địa chỉ Email của bạn:</label>
            <div class="flex items-center space-x-2">
                <input id="email-address" type="text" readonly 
                    class="w-full p-3 bg-gray-50 border rounded-lg text-blue-600 font-medium focus:outline-none"
                    value="Đang tạo email...">
                <button onclick="copyEmail()" class="bg-green-500 text-white p-3 rounded-lg hover:bg-green-600 transition active:scale-95">
                    <i class="fas fa-copy"></i>
                </button>
            </div>
            <p class="text-xs text-gray-500 mt-2 italic">* Email này sẽ tự động nhận thư sau mỗi 5 giây.</p>
        </div>

        <!-- Hộp thư đến -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <div class="bg-gray-50 p-4 border-b">
                <h2 class="font-bold text-gray-700"><i class="fas fa-inbox mr-2"></i>Hộp thư đến</h2>
            </div>
            <div id="messages-list" class="divide-y divide-gray-200">
                <div class="p-8 text-center text-gray-400">
                    <i class="fas fa-spinner fa-spin text-3xl mb-2"></i>
                    <p>Đang chờ thư mới...</p>
                </div>
            </div>
        </div>

        <!-- Nút Hỗ trợ & Báo lỗi (Đã được gắn đúng vị trí) -->
        <div class="text-center mt-8 pb-10">
            <a href="support.html" class="inline-flex items-center text-blue-600 hover:text-blue-800 font-medium transition duration-200">
                <i class="fas fa-info-circle mr-2"></i>
                <span>Báo lỗi hoặc Cần hỗ trợ?</span>
            </a>
        </div>
    </div>

    <script>
        const API_URL = 'https://api.mail.tm';
        let currentAccount = null;

        // 1. Tạo tài khoản ngẫu nhiên
        async function createAccount() {
            try {
                const domainRes = await fetch(`${API_URL}/domains`);
                const domains = await domainRes.json();
                const domain = domains['hydra:member'][0].domain;
                
                const address = `user${Math.random().toString(36).substring(7)}@${domain}`;
                const password = 'password123';

                const res = await fetch(`${API_URL}/accounts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address, password })
                });

                const account = await res.json();
                
                const tokenRes = await fetch(`${API_URL}/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address, password })
                });
                const tokenData = await tokenRes.json();
                
                currentAccount = { ...account, token: tokenData.token };
                document.getElementById('email-address').value = address;
                
                setInterval(fetchMessages, 5000);
            } catch (error) {
                console.error("Lỗi tạo tài khoản:", error);
                document.getElementById('email-address').value = "Lỗi kết nối API!";
            }
        }

        // 2. Lấy danh sách tin nhắn
        async function fetchMessages() {
            if (!currentAccount) return;
            
            try {
                const res = await fetch(`${API_URL}/messages`, {
                    headers: { 'Authorization': `Bearer ${currentAccount.token}` }
                });
                const data = await res.json();
                const messages = data['hydra:member'];
                
                const list = document.getElementById('messages-list');
                if (messages.length === 0) {
                    list.innerHTML = '<div class="p-8 text-center text-gray-400">Chưa có thư nào đến.</div>';
                    return;
                }

                list.innerHTML = messages.map(msg => `
                    <div class="p-4 hover:bg-blue-50 cursor-pointer transition border-l-4 border-transparent hover:border-blue-500">
                        <div class="flex justify-between">
                            <span class="font-bold text-blue-800 text-sm truncate">${msg.from.address}</span>
                            <span class="text-[10px] text-gray-400 uppercase font-semibold">Vừa xong</span>
                        </div>
                        <div class="text-sm font-bold text-gray-900 mt-1">${msg.subject || '(Không có tiêu đề)'}</div>
                        <div class="text-xs text-gray-500 truncate mt-1">${msg.intro}</div>
                    </div>
                `).join('');
            } catch (error) {
                console.error("Lỗi lấy tin nhắn:", error);
            }
        }

        function copyEmail() {
            const emailInput = document.getElementById('email-address');
            emailInput.select();
            document.execCommand('copy');
            alert('Đã sao chép địa chỉ email vào bộ nhớ tạm!');
        }

        createAccount();
    </script>
</body>
</html>
