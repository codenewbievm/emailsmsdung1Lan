<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hỗ trợ & Báo lỗi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <nav class="bg-blue-600 p-4 text-white shadow-lg">
        <div class="container mx-auto flex items-center">
            <a href="index.html" class="mr-4 hover:text-blue-200 transition"><i class="fas fa-arrow-left"></i> Quay lại</a>
            <h1 class="text-xl font-bold">Gửi Báo Lỗi / Hỗ Trợ</h1>
        </div>
    </nav>

    <div class="container mx-auto p-4 max-w-lg">
        <div class="bg-white rounded-xl shadow-md p-6 mt-6 border-t-4 border-blue-500">
            <h2 class="text-gray-800 text-lg font-bold mb-4 text-center">Chúng tôi có thể giúp gì cho bạn?</h2>
            <form id="contact-form">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2 italic">Họ và tên:</label>
                    <input type="text" name="user_name" id="user_name" required 
                        class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" 
                        placeholder="Nhập họ và tên của bạn...">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2 italic">Email để nhận phản hồi:</label>
                    <input type="email" name="user_email" id="user_email" required 
                        class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="example@gmail.com">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2 italic">Mô tả chi tiết lỗi:</label>
                    <textarea name="message" id="message" rows="4" required 
                        class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="Web không tạo được email, giao diện bị lỗi..."></textarea>
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition active:scale-95 shadow-md">
                    <i class="fas fa-paper-plane mr-2"></i>Gửi ngay cho Admin
                </button>
            </form>
            <div id="status-msg" class="mt-4 text-center hidden p-3 rounded-lg text-sm font-medium"></div>
        </div>
        
        <p class="text-center text-gray-400 text-xs mt-6">© 2026 Temp Mail Service - Hệ thống hỗ trợ tự động</p>
    </div>

    <script type="text/javascript">
        (function() {
            emailjs.init("jTVIEnSzRcRkMT6Bm");
        })();

        document.getElementById('contact-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const status = document.getElementById('status-msg');
            const btn = document.getElementById('submit-btn');
            
            status.classList.remove('hidden');
            status.className = "mt-4 text-center text-blue-600 bg-blue-50 p-3 rounded-lg animate-pulse";
            status.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Đang gửi yêu cầu của bạn...';
            btn.disabled = true;

            emailjs.sendForm('service_k67j4x8', 'template_mcqt4ss', this)
                .then(function() {
                    status.className = "mt-4 text-center text-green-700 bg-green-50 p-3 rounded-lg shadow-inner";
                    status.innerHTML = '<i class="fas fa-check-circle mr-2"></i>Gửi thành công! Hãy kiểm tra Gmail nhé.';
                    document.getElementById('contact-form').reset();
                    btn.disabled = false;
                }, function(error) {
                    status.className = "mt-4 text-center text-red-700 bg-red-50 p-3 rounded-lg shadow-inner";
                    status.innerHTML = '<i class="fas fa-exclamation-triangle mr-2"></i>Lỗi: Không thể gửi đi. Hãy kiểm tra lại API.';
                    console.error('FAILED...', error);
                    btn.disabled = false;
                });
        });
    </script>
</body>
</html>
