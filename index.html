<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="google-site-verification" content="google68544c1f28826b5b" />
    
    <title>5GSMS - Hệ thống Email ảo bảo mật</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { -webkit-user-select: none; user-select: none; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <nav class="bg-blue-600 p-4 shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center text-white">
            <div class="flex items-center space-x-2">
                <i class="fas fa-paper-plane text-2xl"></i>
                <span class="text-xl font-bold tracking-wider">5GSMS</span>
            </div>
            <button onclick="handleLogout()" class="bg-blue-500 hover:bg-red-500 px-4 py-2 rounded-full text-sm font-medium transition-all duration-300">
                <i class="fas fa-power-off mr-2"></i>THOÁT
            </button>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8 max-w-xl">
        <div class="glass-card rounded-3xl shadow-xl p-8 mb-8 border border-white">
            <h2 class="text-gray-400 text-xs font-bold uppercase tracking-widest mb-4 text-center">Địa chỉ Email định danh</h2>
            <div class="relative group">
                <input id="email-address" type="text" readonly 
                    class="w-full p-5 bg-blue-50 border-2 border-blue-100 rounded-2xl text-blue-700 font-bold text-center focus:outline-none text-lg" 
                    value="Đang kết nối vệ tinh...">
                <button onclick="copyEmail()" class="absolute right-3 top-3 bg-blue-600 text-white p-3 rounded-xl hover:scale-105 transition-transform shadow-lg">
                    <i class="fas fa-copy text-lg"></i>
                </button>
            </div>

            <div class="flex justify-between items-center mt-8 mb-4">
                <h3 class="font-bold text-gray-800 text-lg">Hộp thư đến</h3>
                <span class="bg-blue-100 text-blue-600 text-[10px] px-3 py-1 rounded-full font-black tracking-tighter">AUTO REFRESH</span>
            </div>
            
            <div id="messages-list" class="space-y-4 min-h-[200px]">
                <div class="py-12 text-center">
                    <p class="text-gray-400 italic text-sm">Chưa có dữ liệu mới từ vệ tinh.</p>
                </div>
            </div>
        </div>

        <div class="glass-card rounded-3xl shadow-lg p-6 border border-white">
            <div class="flex items-center space-x-3 mb-4">
                <div class="bg-blue-100 p-3 rounded-2xl text-blue-600">
                    <i class="fas fa-shield-alt text-xl"></i>
                </div>
                <div>
                    <h4 class="font-bold text-gray-800">Dịch vụ bảo mật 24/7</h4>
                    <p class="text-xs text-gray-500">Hệ thống tự động hủy dữ liệu để bảo vệ danh tính của bạn.</p>
                </div>
            </div>
        </div>
        
        <p class="text-center text-gray-400 text-[10px] mt-8">© 2026 5GSMS SYSTEM - PHÁT TRIỂN BỞI ADMIN</p>
    </div>

    <script>
        // Chống F12 và Chuột phải - Giữ nguyên của bạn
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = e => { 
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73) || (e.ctrlKey && e.keyCode == 85)) return false; 
        };

        // Hàm copy email - Giữ nguyên của bạn
        function copyEmail() {
            const el = document.getElementById('email-address');
            el.select();
            document.execCommand('copy');
            alert('Đã sao chép địa chỉ!');
        }

        // Logic xử lý API và Firebase của bạn giữ nguyên ở đây...
    </script>
</body>
</html>
