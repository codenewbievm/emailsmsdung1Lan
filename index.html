<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="google-site-verification" content="0SDAnnWpyZj7ca0sItHWzfHtLQpYoEYksXVMy9I_Y6I" />
    
    <title>5GSMS - Hệ thống Email ảo bảo mật</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* Bảo mật: Chống bôi đen văn bản */
        body { 
            -webkit-user-select: none; 
            -moz-user-select: none; 
            -ms-user-select: none; 
            user-select: none; 
            background-color: #f8fafc;
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px); 
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Cấu hình Firebase của bạn
        const firebaseConfig = {
            apiKey: "AIzaSyDb1w0ZJxyTAY2usK6Agnr1ArQ_YIOGh-Y",
            authDomain: "tempmail-login-810b3.firebaseapp.com",
            projectId: "tempmail-login-810b3",
            appId: "1:821078583826:web:04cc70bfbbc36cba6dc6cb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Kiểm tra đăng nhập
        onAuthStateChanged(auth, (user) => {
            if (!user) { window.location.href = 'login.html'; }
        });

        window.handleLogout = () => {
            signOut(auth).then(() => { window.location.href = 'login.html'; });
        };
    </script>
</head>
<body class="min-h-screen font-sans">

    <nav class="bg-blue-600 p-4 shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center text-white">
            <div class="flex items-center space-x-2">
                <i class="fas fa-paper-plane text-2xl rotate-12"></i>
                <span class="text-xl font-black tracking-tighter">5GSMS</span>
            </div>
            <button onclick="handleLogout()" class="bg-blue-500 hover:bg-red-500 px-5 py-2 rounded-full text-xs font-bold transition-all duration-300 flex items-center shadow-inner">
                <i class="fas fa-power-off mr-2"></i> THOÁT
            </button>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8 max-w-xl">
        <div class="glass-card rounded-3xl shadow-2xl p-8 mb-8 border border-white relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-400 to-blue-600"></div>
            
            <h2 class="text-gray-400 text-[10px] font-black uppercase tracking-[0.2em] mb-4 text-center">Địa chỉ Email định danh</h2>
            
            <div class="relative group">
                <input id="email-address" type="text" readonly 
                    class="w-full p-5 bg-blue-50 border-2 border-blue-100 rounded-2xl text-blue-700 font-bold text-center focus:outline-none text-lg shadow-inner" 
                    value="Đang kết nối vệ tinh...">
                <button onclick="copyEmail()" class="absolute right-3 top-3 bg-blue-600 text-white p-3 rounded-xl hover:scale-105 transition-all shadow-lg active:bg-blue-800">
                    <i class="fas fa-copy text-lg"></i>
                </button>
            </div>

            <div class="flex justify-between items-center mt-10 mb-4">
                <h3 class="font-black text-gray-800 text-lg flex items-center">
                    <i class="fas fa-inbox mr-2 text-blue-500"></i> Hộp thư đến
                </h3>
                <span class="bg-blue-100 text-blue-600 text-[9px] px-3 py-1 rounded-full font-black animate-pulse">AUTO REFRESH</span>
            </div>
            
            <div id="messages-list" class="space-y-4 min-h-[150px] flex flex-col justify-center">
                <div class="py-8 text-center">
                    <p class="text-gray-400 italic text-sm">Chưa có dữ liệu mới từ vệ tinh.</p>
                </div>
            </div>
        </div>

        <div class="glass-card rounded-3xl shadow-lg p-6 border border-white flex items-center space-x-4">
            <div class="bg-blue-50 p-4 rounded-2xl text-blue-600 shadow-sm">
                <i class="fas fa-shield-alt text-2xl"></i>
            </div>
            <div>
                <h4 class="font-bold text-gray-800 text-sm">Dịch vụ bảo mật 24/7</h4>
                <p class="text-xs text-gray-500 leading-relaxed">Hệ thống tự động hủy dữ liệu để bảo vệ danh tính của bạn.</p>
            </div>
        </div>
        
        <footer class="text-center text-gray-400 text-[9px] mt-12 font-medium tracking-widest">
            © 2026 5GSMS SYSTEM - PHÁT TRIỂN BỞI ADMIN
        </footer>
    </div>

    <script>
        // Chống F12, Chuột phải, Ctrl+U
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73) || (e.ctrlKey && e.keyCode == 85)) {
                return false;
            }
        };

        function copyEmail() {
            const input = document.getElementById('email-address');
            input.select();
            document.execCommand('copy');
            alert('Đã sao chép địa chỉ Email!');
        }

        // Bạn có thể thêm logic API lấy email tại đây tương tự bản trước
    </script>
</body>
</html>
