<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>5GSMS - Dịch Vụ Email Ảo Bảo Mật Tốc Độ Cao</title>
    <meta name="description" content="5GSMS cung cấp email tạm thời miễn phí, bảo vệ thông tin cá nhân và tránh tin nhắn rác hiệu quả.">
    <meta name="google-site-verification" content="google68544c1f28826b5b" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDb1w0ZJxyTAY2usK6Agnr1ArQ_YIOGh-Y",
            authDomain: "tempmail-login-810b3.firebaseapp.com",
            projectId: "tempmail-login-810b3",
            appId: "1:821078583826:web:04cc70bfbbc36cba6dc6cb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) { window.location.href = 'login.html'; }
        });

        window.handleLogout = () => {
            signOut(auth).then(() => { window.location.href = 'login.html'; });
        };
    </script>

    <style>
        /* Chặn bôi đen văn bản */
        body { 
            -webkit-user-select: none; 
            -moz-user-select: none; 
            -ms-user-select: none; 
            user-select: none; 
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-blue-600 p-4 text-white shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold italic"><i class="fas fa-paper-plane mr-2"></i>5GSMS</h1> 
            <div class="flex items-center space-x-4">
                <button onclick="location.reload()" class="bg-blue-500 hover:bg-blue-700 px-3 py-1 rounded text-sm transition">
                    <i class="fas fa-sync-alt"></i> Làm mới
                </button>
                <button onclick="handleLogout()" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm transition">
                    <i class="fas fa-sign-out-alt"></i> Đăng xuất
                </button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-4 max-w-2xl">
        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2 text-blue-600">Địa chỉ Email 5GSMS của bạn:</label>
            <div class="flex items-center space-x-2">
                <input id="email-address" type="text" readonly class="w-full p-3 bg-gray-50 border rounded-lg text-blue-600 font-bold focus:outline-none" value="Đang tạo email...">
                <button onclick="copyEmail()" class="bg-green-500 text-white p-3 rounded-lg hover:bg-green-600 transition active:scale-95">
                    <i class="fas fa-copy"></i>
                </button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-md overflow-hidden border-t-4 border-blue-500">
            <div class="bg-gray-50 p-4 border-b text-gray-700 font-bold flex justify-between items-center">
                <span><i class="fas fa-inbox mr-2"></i>Hộp thư đến</span>
            </div>
            <div id="messages-list" class="divide-y divide-gray-200">
                <div class="p-8 text-center text-gray-400">
                    <i class="fas fa-spinner fa-spin text-3xl mb-2 text-blue-300"></i>
                    <p>Đang chờ thư mới...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73) || (e.ctrlKey && e.keyCode == 85)) {
                return false;
            }
        };

        const API_URL = 'https://api.mail.tm';
        let currentAccount = null;

        async function createAccount() {
            const display = document.getElementById('email-address');
            try {
                const domainRes = await fetch(`${API_URL}/domains`);
                const domains = await domainRes.json();
                const domain = domains['hydra:member'][0].domain;
                const address = `user${Math.random().toString(36).substring(7)}@${domain}`;
                const password = 'password123';
                const res = await fetch(`${API_URL}/accounts`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ address, password }) });
                if(!res.ok) throw new Error();
                const account = await res.json();
                const tokenRes = await fetch(`${API_URL}/token`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ address, password }) });
                const tokenData = await tokenRes.json();
                currentAccount = { ...account, token: tokenData.token };
                display.value = address;
                setInterval(fetchMessages, 5000);
            } catch (e) { 
                display.value = "Đang kết nối lại...";
                setTimeout(createAccount, 3000);
            }
        }

        async function fetchMessages() {
            if (!currentAccount) return;
            try {
                const res = await fetch(`${API_URL}/messages`, { headers: { 'Authorization': `Bearer ${currentAccount.token}` }});
                const data = await res.json();
                const messages = data['hydra:member'];
                const list = document.getElementById('messages-list');
                if (messages.length === 0) { list.innerHTML = '<div class="p-8 text-center text-gray-400 italic">Chưa có thư mới.</div>'; return; }
                list.innerHTML = messages.map(msg => `
                    <div class="p-4 hover:bg-blue-50 border-l-4 border-transparent hover:border-blue-500 transition">
                        <div class="text-sm font-bold text-blue-800">${msg.from.address}</div>
                        <div class="text-sm font-bold text-gray-900 mt-1">${msg.subject || '(Trống)'}</div>
                        <div class="text-xs text-gray-500 mt-1 truncate">${msg.intro}</div>
                    </div>
                `).join('');
            } catch (e) {}
        }

        function copyEmail() { 
            const input = document.getElementById('email-address'); 
            input.select(); 
            document.execCommand('copy'); 
            alert('Đã sao chép địa chỉ 5GSMS!'); 
        }
        createAccount();
    </script>
</body>
</html>
