<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hỗ trợ & Báo lỗi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-blue-600 p-4 text-white shadow-lg">
        <div class="container mx-auto flex items-center">
            <a href="index.html" class="mr-4"><i class="fas fa-arrow-left"></i> Quay lại</a>
            <h1 class="text-xl font-bold">Gửi Báo Lỗi / Hỗ Trợ</h1>
        </div>
    </nav>

    <div class="container mx-auto p-4 max-w-lg">
        <div class="bg-white rounded-xl shadow-md p-6">
            <form id="contact-form">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Tên của bạn:</label>
                    <input type="text" name="user_name" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Email phản hồi:</label>
                    <input type="email" name="user_email" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Nội dung lỗi:</label>
                    <textarea name="message" rows="4" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">
                    Gửi yêu cầu
                </button>
            </form>
            <div id="status-msg" class="mt-4 text-center hidden"></div>
        </div>
    </div>

    <script type="text/javascript">
        (function() {
            // Thay 'YOUR_PUBLIC_KEY' bằng Key từ EmailJS nếu bạn muốn dùng thật
            emailjs.init("YOUR_PUBLIC_KEY");
        })();

        document.getElementById('contact-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const status = document.getElementById('status-msg');
            status.classList.remove('hidden');
            status.textContent = "Đang gửi... 🚀";

            // Tạm thời hiển thị thông báo giả lập (khi chưa có API Key)
            setTimeout(() => {
                status.className = "mt-4 text-center text-green-600 font-bold";
                status.textContent = "Gửi thành công! Admin sẽ phản hồi sớm.";
                this.reset();
            }, 1500);
        });
    </script>
</body>
</html>
