<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hỗ trợ & Báo lỗi - 5GSMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">

    <nav class="bg-blue-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-lg mx-auto px-4 py-4 flex items-center gap-4">
            <a href="index.html" class="hover:text-blue-200 transition flex items-center gap-2 text-sm font-bold">
                <i class="fas fa-arrow-left"></i> Quay lại
            </a>
            <h1 class="text-lg font-black uppercase tracking-tight">Gửi Báo Lỗi / Hỗ Trợ</h1>
        </div>
    </nav>

    <div class="max-w-lg mx-auto px-4 py-6">
        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 p-7 border-t-4 border-t-blue-500">
            <h2 class="text-slate-800 text-lg font-black text-center mb-6">Chúng tôi có thể giúp gì cho bạn?</h2>

            <div id="contact-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 italic">Họ và tên</label>
                    <input type="text" id="user_name" required
                        class="w-full p-3.5 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition text-sm"
                        placeholder="Nhập họ và tên của bạn...">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 italic">Email nhận phản hồi</label>
                    <input type="email" id="user_email" required
                        class="w-full p-3.5 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition text-sm"
                        placeholder="example@gmail.com">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 italic">Mô tả chi tiết lỗi</label>
                    <textarea id="message" rows="4" required
                        class="w-full p-3.5 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition text-sm resize-none"
                        placeholder="Web không tạo được email, giao diện bị lỗi..."></textarea>
                </div>
                <button id="submit-btn" onclick="sendForm()"
                    class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-2xl hover:bg-blue-700 active:scale-95 transition shadow-lg shadow-blue-200 text-sm">
                    <i class="fas fa-paper-plane mr-2"></i>Gửi ngay cho Admin
                </button>
            </div>

            <div id="status-msg" class="hidden mt-4 text-center p-3 rounded-2xl text-sm font-medium"></div>
        </div>

        <p class="text-center text-slate-300 text-xs mt-6">© 2026 5GSMS - Hệ thống hỗ trợ tự động</p>
    </div>

    <script>
        emailjs.init("jTVIEnSzRcRkMT6Bm");

        function sendForm() {
            const name  = document.getElementById('user_name').value.trim();
            const email = document.getElementById('user_email').value.trim();
            const msg   = document.getElementById('message').value.trim();
            const status = document.getElementById('status-msg');
            const btn   = document.getElementById('submit-btn');

            if (!name || !email || !msg) {
                status.className = 'mt-4 text-center p-3 rounded-2xl text-sm font-medium bg-yellow-50 text-yellow-700';
                status.textContent = 'Vui lòng điền đầy đủ thông tin!';
                status.classList.remove('hidden');
                return;
            }

            status.className = 'mt-4 text-center p-3 rounded-2xl text-sm font-medium bg-blue-50 text-blue-600';
            status.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Đang gửi yêu cầu...';
            status.classList.remove('hidden');
            btn.disabled = true;

            emailjs.send('service_k67j4x8', 'template_mcqt4ss', {
                user_name:  name,
                user_email: email,
                message:    msg
            }).then(() => {
                status.className = 'mt-4 text-center p-3 rounded-2xl text-sm font-medium bg-green-50 text-green-700';
                status.innerHTML = '<i class="fas fa-check-circle mr-2"></i>Gửi thành công! Hãy kiểm tra Gmail nhé.';
                document.getElementById('user_name').value = '';
                document.getElementById('user_email').value = '';
                document.getElementById('message').value = '';
                btn.disabled = false;
            }).catch(err => {
                status.className = 'mt-4 text-center p-3 rounded-2xl text-sm font-medium bg-red-50 text-red-700';
                status.innerHTML = '<i class="fas fa-exclamation-triangle mr-2"></i>Lỗi gửi! Kiểm tra lại kết nối.';
                console.error(err);
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
